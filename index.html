<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Regresiva</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #f8fafc;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .countdown-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 16px;
            min-width: 120px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
            border-color: #6366f1;
        }

        .number {
            font-size: 3.5rem;
            font-weight: 700;
            color: #6366f1;
            display: block;
            line-height: 1;
            margin-bottom: 5px;
        }

        .label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #cbd5e1;
        }

        #message {
            font-size: 2rem;
            font-weight: bold;
            color: #10b981;
            display: none;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .time-box { min-width: 90px; padding: 15px; }
            .number { font-size: 2.2rem; }
            .label { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <h1>Faltan muy poco</h1>
    <p class="subtitle">Cuenta regresiva para el 17 de Julio</p>

    <div class="countdown-container" id="countdown">
        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">Días</span>
        </div>
        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">Horas</span>
        </div>
        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">Minutos</span>
        </div>
        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">Segundos</span>
        </div>
    </div>

    <div id="message">¡Ha llegado el día! 🎉</div>

    <script>
        function getTargetDate() {
            const currentYear = new Date().getFullYear();
            let targetDate = new Date(`July 17, ${currentYear} 00:00:00`).getTime();
            const now = new Date().getTime();

            // Si el 17 de julio de este año ya pasó, apunta al del próximo año automáticamente
            if (targetDate < now) {
                targetDate = new Date(`July 17, ${currentYear + 1} 00:00:00`).getTime();
            }
            return targetDate;
        }

        const countDownDate = getTargetDate();

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            // Cálculos de tiempo para días, horas, minutos y segundos
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Muestra el resultado en los elementos correspondientes con formato de dos dígitos
            document.getElementById("days").innerHTML = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerHTML = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerHTML = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerHTML = seconds < 10 ? "0" + seconds : seconds;

            // Si la cuenta regresiva termina
            if (distance < 0) {
                clearInterval(x);
                document.getElementById("countdown").style.display = "none";
                document.getElementById("message").style.display = "block";
            }
        }, 1000);
    </script>
</body>
</html>
